[project]
name = "lab-dask-on-ec2"
version = "0.1.0"
description = "Lab for running Dask on Amazon EC2 for data analytics"
requires-python = ">=3.11"
dependencies = [
    # Keep the Dask version in sync with DASK_VERSION in ../setup-dask-cluster.sh
    "dask[complete]==2026.8.0",
    "s3fs>=2024.2.0",
    "pandas>=2.2.0",
    "numpy>=1.24.0",
    "pyarrow>=21.0.0",
    "matplotlib>=3.7.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.uv]
# A set of lab scripts, not an installable package
package = false
